name: Deploy

# Deploy on merge. Branch -> target org mapping:
#   develop -> Developer sandbox   (orgfarm-dcf0a4eebe--developer.sandbox.my.salesforce.com)  secret: SFDX_AUTH_URL_DEVELOP
#   stage   -> UAT sandbox         (orgfarm-dcf0a4eebe--uat.sandbox.my.salesforce.com)        secret: SFDX_AUTH_URL_STAGE
#   main    -> Production          (orgfarm-dcf0a4eebe.my.salesforce.com)                     secret: SFDX_AUTH_URL_PRODUCTION
on:
  push:
    branches:
      - develop
      - stage
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to target org
        env:
          SFDX_AUTH_URL: ${{ (github.ref_name == 'main' && secrets.SFDX_AUTH_URL_PRODUCTION) || (github.ref_name == 'stage' && secrets.SFDX_AUTH_URL_STAGE) || secrets.SFDX_AUTH_URL_DEVELOP }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Missing SFDX auth URL secret for branch '${{ github.ref_name }}'."
            exit 1
          fi
          printf '%s' "$SFDX_AUTH_URL" > ./auth_url.txt
          sf org login sfdx-url --sfdx-url-file ./auth_url.txt --alias target --set-default
          rm -f ./auth_url.txt

      - name: Deploy to org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests \
            --target-org target \
            --wait 60
