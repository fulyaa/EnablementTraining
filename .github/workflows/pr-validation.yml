name: PR Validation

# Validate every pull request with a check-only deployment + local tests.
# Nothing is actually deployed here. The PR's target branch decides which org
# it is validated against:
#   -> develop : Developer sandbox   secret: SFDX_AUTH_URL_DEVELOP
#   -> stage   : UAT sandbox         secret: SFDX_AUTH_URL_STAGE
#   -> main    : Production          secret: SFDX_AUTH_URL_PRODUCTION
on:
  pull_request:
    branches:
      - develop
      - stage
      - main

jobs:
  validate:
    name: Check-only deploy + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to target org
        env:
          SFDX_AUTH_URL: ${{ (github.base_ref == 'main' && secrets.SFDX_AUTH_URL_PRODUCTION) || (github.base_ref == 'stage' && secrets.SFDX_AUTH_URL_STAGE) || secrets.SFDX_AUTH_URL_DEVELOP }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Missing SFDX auth URL secret for target '${{ github.base_ref }}'."
            exit 1
          fi
          printf '%s' "$SFDX_AUTH_URL" > ./auth_url.txt
          sf org login sfdx-url --sfdx-url-file ./auth_url.txt --alias target --set-default
          rm -f ./auth_url.txt

      - name: Validate deployment (dry run)
        run: |
          sf project deploy start \
            --dry-run \
            --source-dir force-app \
            --test-level RunLocalTests \
            --target-org target \
            --wait 60
